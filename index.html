<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MailVault — Securely read Outlook inbox emails using Microsoft Graph API with OAuth2 refresh tokens.">
    <title>MailVault — Outlook Mail Reader</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <div class="header-inner">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                        <rect x="2" y="5" width="20" height="14" rx="2.5" stroke="white" stroke-width="1.8" fill="none"/>
                        <path d="M3 6.5L12 13.5L21 6.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                </div>
                <h1 class="logo-text">Mail<span class="logo-accent">Vault</span></h1>
            </div>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">
                    <svg class="theme-icon theme-icon-moon" width="16" height="16" viewBox="0 0 18 18" fill="none">
                        <path d="M15.5 9.87A7 7 0 1 1 8.13 2.5 5.5 5.5 0 0 0 15.5 9.87Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <svg class="theme-icon theme-icon-sun" width="16" height="16" viewBox="0 0 18 18" fill="none" style="display:none;">
                        <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M9 1.5V3M9 15V16.5M1.5 9H3M15 9H16.5M3.7 3.7L4.76 4.76M13.24 13.24L14.3 14.3M14.3 3.7L13.24 4.76M4.76 13.24L3.7 14.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <span class="status-badge" id="statusBadge">
                    <span class="status-dot"></span>
                    Ready
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Input Section -->
        <section class="input-section" id="inputSection">
            <!-- Hero -->
            <div class="hero-section">
                <div class="hero-icon">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <rect x="4" y="8" width="32" height="24" rx="4" fill="#e8f2fc" stroke="#0f6cbd" stroke-width="1.5"/>
                        <path d="M6 11L20 23L34 11" stroke="#0f6cbd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                        <circle cx="32" cy="12" r="5" fill="#0f6cbd"/>
                        <path d="M30.5 12H33.5M32 10.5V13.5" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                </div>
                <h2 class="hero-title">Read Outlook Inbox</h2>
                <p class="hero-subtitle">Access emails using Microsoft Graph API</p>
            </div>

            <!-- Input Card -->
            <div class="input-card" id="inputCard">
                <!-- Mode Selector -->
                <div class="mode-selector">
                    <div class="mode-options">
                        <button class="mode-btn active" id="modeOAuth2" data-mode="oauth2">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                                <path d="M8 1L14 4V8C14 11.31 11.42 14.38 8 15C4.58 14.38 2 11.31 2 8V4L8 1Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M6 8L7.5 9.5L10.5 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            OAuth2
                        </button>
                        <button class="mode-btn" id="modeGraphAPI" data-mode="graphapi">
                            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                                <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M8 4V8L10.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            Graph API
                        </button>
                    </div>
                </div>

                <!-- Credential Input -->
                <div class="input-group">
                    <label class="input-label" for="credentialInput">Credentials</label>
                    <div class="textarea-wrapper">
                        <textarea
                            id="credentialInput"
                            class="credential-textarea"
                            placeholder="email|password|refresh_token|client_id"
                            rows="4"
                            spellcheck="false"
                        ></textarea>
                        <div class="textarea-actions">
                            <button class="icon-btn" id="pasteBtn" title="Paste from clipboard">
                                <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                                    <rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
                                    <path d="M10 4V3C10 2.17 9.33 1.5 8.5 1.5H3C2.17 1.5 1.5 2.17 1.5 3V8.5C1.5 9.33 2.17 10 3 10H4" stroke="currentColor" stroke-width="1.3"/>
                                </svg>
                            </button>
                            <button class="icon-btn" id="clearBtn" title="Clear input">
                                <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                                    <path d="M3 3L11 11M11 3L3 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <p class="input-hint" id="inputHint">
                        Format: <code>email|password|refresh_token|client_id</code>
                    </p>
                </div>

                <!-- Action Button -->
                <button class="read-btn" id="readMailBtn">
                    <span class="btn-content">
                        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
                            <rect x="2" y="4" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
                            <path d="M2 6L10 12L18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                        Read Mailbox
                    </span>
                    <span class="btn-loading" style="display:none;">
                        <div class="spinner"></div>
                        Connecting...
                    </span>
                </button>
            </div>
        </section>

        <!-- Results Section -->
        <section class="results-section" id="resultsSection" style="display:none;">
            <!-- Account Info Bar -->
            <div class="account-bar" id="accountBar">
                <div class="account-info">
                    <div class="account-avatar" id="accountAvatar">?</div>
                    <div class="account-details">
                        <span class="account-email" id="accountEmail">—</span>
                        <span class="account-stats" id="accountStats">0 emails loaded</span>
                    </div>
                </div>
                <div class="account-actions">
                    <button class="action-btn" id="refreshBtn" title="Refresh inbox">
                        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                            <path d="M14 8A6 6 0 1 1 8 2C10.76 2 13 4.24 13 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M10 7H14V3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Refresh
                    </button>
                    <button class="action-btn action-btn-danger" id="closeResultsBtn" title="Close results">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                            <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        Close
                    </button>
                </div>
            </div>

            <!-- Email List -->
            <div class="email-list" id="emailList">
                <!-- Emails will be rendered here dynamically -->
            </div>
        </section>

        <!-- Email Detail Modal -->
        <div class="modal-overlay" id="modalOverlay" style="display:none;">
            <div class="email-modal" id="emailModal">
                <div class="modal-top-bar">
                    <button class="modal-close-btn" id="modalCloseBtn">
                        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
                            <path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
                <div class="modal-header">
                    <h3 class="modal-subject" id="modalSubject">Subject</h3>
                </div>
                <div class="modal-meta">
                    <div class="modal-sender">
                        <div class="modal-avatar" id="modalAvatar">?</div>
                        <div class="modal-sender-info">
                            <span class="modal-sender-name" id="modalFrom">—</span>
                            <span class="modal-sender-date" id="modalDate">—</span>
                        </div>
                    </div>
                </div>
                <div class="modal-body" id="modalBody">
                    <!-- Email body content -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <p class="footer-text">MailVault &middot; Powered by Microsoft Graph API</p>
            <div class="footer-links">
                <a href="https://learn.microsoft.com/en-us/graph/api/resources/mail-api-overview" target="_blank" rel="noopener">API Docs</a>
            </div>
        </div>
    </footer>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/app.js"></script>
</body>
</html>
